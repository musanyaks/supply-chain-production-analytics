version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scms_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supplychain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/tables.sql:/docker-entrypoint-initdb.d/02_tables.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/03_seed.sql

  api:
    build: .
    container_name: scms_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/supplychain

volumes:
  postgres_data: